
name: Build Worker Pay APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      # 4. Check environment
      - name: Check Environment
        run: |
          java -version
          flutter --version
          flutter doctor -v

      # 5. Verify app icon
      - name: Verify App Icon
        run: |
          test -f assets/icon/worker_pay_icon.png || {
            echo "Worker Pay icon image not found!"
            exit 1
          }

      # 6. Create Android project
      - name: Create Android project
        run: flutter create --platforms=android --project-name worker_pay_pro .

      # 7. Configure app launcher icon
      - name: Configure App Icon
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/worker_pay_icon.png"
            min_sdk_android: 21
          EOF

          dart pub global activate flutter_launcher_icons
          dart pub global run flutter_launcher_icons -f flutter_launcher_icons.yaml

      # 8. Configure AdMob App ID
      - name: Configure AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          app_id = "ca-app-pub-5733288202268497~2388066516"
          metadata = (
              '        <meta-data '
              'android:name="com.google.android.gms.ads.APPLICATION_ID" '
              f'android:value="{app_id}"/>\n'
          )

          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = content.replace(
                  "</application>",
                  metadata + "    </application>"
              )
              manifest.write_text(content)

          if "com.google.android.gms.ads.APPLICATION_ID" not in manifest.read_text():
              raise SystemExit("AdMob App ID configuration failed")

          print("AdMob App ID configured successfully.")
          PY

      # 9. Get Flutter dependencies
      - name: Get dependencies
        run: flutter pub get

      # 10. Analyze Dart code
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/

      # 11. Build debug APK
      - name: Build APK
        run: flutter build apk --debug --verbose

      # 12. Verify APK
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worker-pay-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
