
name: Build Worker Pay APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Check Environment
        run: |
          java -version
          flutter --version

      - name: Create Android project
        run: flutter create --platforms=android --project-name worker_pay_pro .

      - name: Configure App Icon
        run: |
          dart pub global activate flutter_launcher_icons
          dart pub global run flutter_launcher_icons:main --image_path=assets/icon/worker_pay_icon.png

      - name: Configure AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          app_id = "ca-app-pub-5733288202268497~2388066516"
          metadata = (
              '        <meta-data '
              'android:name="com.google.android.gms.ads.APPLICATION_ID" '
              f'android:value="{app_id}"/>\n'
          )

          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = content.replace(
                  "</application>",
                  metadata + "    </application>"
              )
              manifest.write_text(content)

          if "com.google.android.gms.ads.APPLICATION_ID" not in manifest.read_text():
              raise SystemExit("AdMob App ID configuration failed")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/

      - name: Build APK
        run: flutter build apk --debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worker-pay-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
